<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111512">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SpiderKeeper">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css">
  <title>SpiderKeeper</title>
  <script type="module" src="./app.js"></script>
</head>
<body>
  <a class="skip" href="#content">К содержимому</a>
  <header class="masthead">
    <a class="brand" href="#home">
      <img src="./icons/icon-192.png" width="38" height="38" alt="">
      <span>SpiderKeeper<small>Дневник пауков-птицеедов</small></span>
    </a>
    <div id="connection" class="connection"></div>
  </header>
  <nav id="nav" class="navigation" aria-label="Основная навигация"></nav>
  <main id="content" class="main" tabindex="-1">
    <p id="status" role="status" aria-live="polite" hidden></p>
    <div id="storage-error" role="alert" hidden></div>
    <div id="update"></div>
    <section id="screen" aria-label="Дневник">
      <p class="muted">Открываем дневник…</p>
    </section>
    <noscript>Для работы дневника нужен JavaScript.</noscript>
  </main>
  <dialog id="dialog" aria-labelledby="dialog-title">
    <form id="form">
      <div class="section-head">
        <h2 id="dialog-title"></h2>
        <button id="close-dialog" class="quiet" type="button" aria-label="Закрыть">×</button>
      </div>
      <div id="fields" class="fields"></div>
      <p id="form-error" class="error" role="alert" hidden></p>
      <div class="actions dialog-actions">
        <button id="cancel" class="secondary" type="button">Отмена</button>
        <button id="submit" class="primary" type="submit">Сохранить</button>
      </div>
    </form>
  </dialog>
</body>
</html>
